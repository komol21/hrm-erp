{% extends 'base.html' %}

{% block content %}
<div class="glass-card" style="max-width: 500px; margin: 2rem auto; text-align: center;">
  <div style="font-size: 3rem; color: var(--danger); margin-bottom: 1rem;">⚠️</div>
  <h2 style="margin-bottom: 1rem;">Are you absolutely sure?</h2>
  <p style="color: var(--text-secondary); margin-bottom: 2rem;">
    You are about to permanently delete <strong>"{{ object_name }}"</strong>. This action cannot be undone.
  </p>
  
  <form method="POST" style="display: flex; gap: 1rem; justify-content: center;">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url cancel_url %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
