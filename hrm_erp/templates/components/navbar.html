<header class="top-navbar">
  <div class="nav-left">
    <button class="mobile-toggle" id="mobile-menu-toggle" aria-label="Toggle Navigation Sidebar">☰</button>
    <h1 style="font-size: 1.25rem; font-weight: 700; font-family: 'Outfit', sans-serif;">{% if page_title %}{{ page_title }}{% else %}Dashboard{% endif %}</h1>
  </div>
  
  <div class="nav-right">
    <!-- Theme Toggle Button -->
    <button id="theme-toggle-btn" class="btn btn-secondary" style="border-radius: 50%; padding: 0.5rem; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem;" title="Toggle Light/Dark Mode">
      <span id="theme-toggle-icon">☀️</span>
    </button>
    
    <!-- User Info Pill -->
    <a href="{% url 'employees:my_profile' %}" class="user-profile-pill" style="display: flex; align-items: center; gap: 0.75rem; background: rgba(255, 255, 255, 0.05); padding: 0.35rem 1rem 0.35rem 0.35rem; border-radius: 50px; border: 1px solid var(--border-glass); text-decoration: none; color: inherit;" title="View & Edit My Profile">
      <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 0.85rem;">
        {{ request.user.username|slice:":2"|upper }}
      </div>
      <div style="display: flex; flex-direction: column;">
        <span style="font-size: 0.8rem; font-weight: 600; line-height: 1.2;">{{ request.user.get_full_name|default:request.user.username }}</span>
        <span style="font-size: 0.65rem; color: var(--text-secondary); font-weight: 700; text-transform: uppercase;">
          {% if is_admin %}Admin{% elif is_hr %}HR Manager{% else %}Employee{% endif %}
        </span>
      </div>
    </a>
  </div>
</header>
