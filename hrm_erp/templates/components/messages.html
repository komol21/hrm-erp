{% if messages %}
  <div class="messages-container">
    {% for message in messages %}
      <div class="message-alert message-{{ message.tags }}">
        <span>{{ message }}</span>
        <button onclick="this.parentElement.remove()" style="background: none; border: none; color: inherit; cursor: pointer; font-size: 1.1rem; font-weight: 700; margin-left: 1rem;">×</button>
      </div>
    {% endfor %}
  </div>
{% endif %}
